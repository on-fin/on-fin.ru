<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Заявка на пробу – Финдикатор</title>
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<!-- Служебная страница: решение по заявке на пробу по ссылке из письма-уведомления (сервер, «13 Почта»).
     Открытие страницы ничего не меняет — решение только после нажатия кнопки. Не в карте сайта, не индексируется. -->
<style>
  :root { --ink: #1c2430; --dk: #12305f; --mid: #1f4f9c; --muted: #5b6676; --soft: #e9f0fb; --bg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e6ebf2; --dk: #bcd0f2; --mid: #5b8fe0; --muted: #a0aab8; --soft: #1b2638; --bg: #0f1520; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Arial, sans-serif; }
  main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  h1 { color: var(--dk); font-size: 24px; margin: 0 0 16px; }
  .card { background: var(--soft); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; word-wrap: break-word; }
  .card div { margin: 2px 0; }
  button { font: bold 17px Arial, sans-serif; padding: 12px 22px; border: 0; border-radius: 8px; color: #fff;
    background: var(--mid); cursor: pointer; }
  button.spam { background: #8a94a3; }
  button:disabled { opacity: .6; cursor: default; }
  .result { font-size: 18px; white-space: pre-line; }
  .muted { color: var(--muted); font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Заявка на пробу</h1>
  <div id="box">Загружаю заявку…</div>
  <p class="muted">Финдикатор — служебная страница</p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var data = { a: q.get('a') || '', id: q.get('id') || '', t: q.get('t') || '' };
  var box = document.getElementById('box'), title = document.getElementById('title');
  var server = null;
  function esc(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
  function show(html) { box.innerHTML = html; }
  function call(command) {
    var go = server ? Promise.resolve(server) : fetch('/api.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); }).then(function (api) { server = api.server; return server; });
    return go.then(function (url) {
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ command: command, data: data }) });
    }).then(function (r) { return r.json(); });
  }
  function fail(text) {
    title.textContent = 'Не получилось';
    show('<p>' + esc(text) + '</p>');
  }
  call('mail.info').then(function (res) {
    if (!res.ok) return fail(res.error || 'Ошибка сервера.');
    title.textContent = res.act === 'k' ? 'Выдать пробный ключ?' : 'Отметить заявку как спам?';
    var info = (res.info || []).map(function (x) { return '<div><b>' + esc(x[0]) + ':</b> ' + esc(x[1]) + '</div>'; }).join('');
    if (res.key) {
      title.textContent = 'Ключ уже выдан';
      return show('<div class="card">' + info + '</div><p class="result">✅ Ключ уже выдан: <b>' + esc(res.key) + '</b></p>');
    }
    show('<div class="card">' + info + '</div><button id="go"' + (res.act === 's' ? ' class="spam"' : '') + '>' +
      (res.act === 'k' ? '✅ ' : '🚫 ') + esc(res.label) + '</button>');
    var btn = document.getElementById('go');
    btn.onclick = function () {
      btn.disabled = true; btn.textContent = 'Отправляю…';
      call('mail.decide').then(function (r) {
        if (!r.ok) return fail(r.error || 'Ошибка сервера.');
        title.textContent = 'Готово';
        show('<p class="result">' + esc(r.text) + '</p>');
      }).catch(function () { fail('Нет связи с сервером. Обновите страницу и нажмите кнопку ещё раз.'); });
    };
  }).catch(function () { fail('Нет связи с сервером. Обновите страницу через минуту.'); });
})();
</script>
</body>
</html>
